[package]
name = "util"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync", "net", "io-util", "fs"] }
futures.workspace = true
agones-core = { path = "../agones-core" }
cgp.workspace = true
derive-deftly.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde = { workspace = true, features = ["rc"] }
reqwest.workspace = true
url.workspace = true
tracing = "=0.1.44"
chrono.workspace = true
tokio-util = { version = "=0.7.20", features = ["rt"] }
bytes = "=1.12.1"
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio", "http1", "http2"] }
http-body-util = "=0.1.5"
libc = "=0.2.191"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "=2.2.0"
base64.workspace = true
serde_yaml.workspace = true
comprende = { path = "../../third_party/first-generation/comprende" }
better_comprehension = { path = "../../third_party/first-generation/better-comprehension" }

[lib]
path = "../../rust-support/agones/src/utility_lib.rs"
