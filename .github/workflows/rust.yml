name: Rust reimplementation

on:
  push:
    branches:
      - agones-rs-dev
      - codex/agones-model-diagnostic-*
  pull_request:
    branches:
      - agones-rs-dev

permissions:
  contents: read

jobs:
  migration-state:
    if: ${{ !startsWith(github.ref_name, 'codex/agones-model-diagnostic-') }}
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      model: ${{ steps.affected.outputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned state validator
        run: python -m pip install -r build/scripts/agones-rs/state-requirements.txt
      - name: Validate source-bound implementation gate and ledger
        run: python build/scripts/agones-rs/checkpoint.py check
      - name: Check guidance inheritance
        run: python build/scripts/agones-rs/inventory.py guidance-check
      - name: Reject incomplete or vacuous proof results
        run: python build/scripts/agones-rs/test_kani_results.py
      - name: Reject unprotected execution and corrupted recorder output
        run: python build/scripts/agones-rs/test_ci_model_execution.py
      - name: Require complete source-case parser and matrix coverage
        run: python build/scripts/agones-rs/test_source_case_proofs.py
      - name: Select affected checks conservatively
        id: affected
        env:
          AGONES_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AGONES_CHECK_HEAD: ${{ github.sha }}
        run: python build/scripts/agones-rs/select_checks.py

  rust:
    needs: migration-state
    if: needs.migration-state.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned evidence Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add rustfmt --toolchain 1.98.1
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Check deterministic exact-case generation
        run: cargo run --locked -p agones-rusternetes --example feature_case_codegen -- --check
      - name: Check pinned Go printable-rune table generation
        run: cargo run --locked -p agones-rusternetes --example feature_case_codegen -- --go-quote-table --check
      - name: Check exact SDK source-case generation
        run: cargo run --locked -p agones-rusternetes --example feature_case_codegen -- --sdk-version --check
      - name: Check all exact GameServer source-case generation
        run: cargo run --locked -p agones-rusternetes --example feature_case_codegen -- --gameserver-defaulting --check
      - name: Check all exact GameServer validation source-case generation
        run: cargo run --locked -p agones-rusternetes --example feature_case_codegen -- --gameserver-features --check
      - name: Check all 25 general GameServer validation cases
        run: cargo run --locked -p agones-rusternetes --example feature_case_codegen -- --gameserver-validation --check
      - name: Check all complete shared metadata source cases
        run: cargo run --locked -p agones-rusternetes --example feature_case_codegen -- --object-metadata --check
      - name: Reject unsupported GameServer source lowering
        run: cargo test --locked -p agones-rusternetes --example feature_case_codegen gameserver_codegen_controls
      - name: Check resource derive aliases, facades, generics, and rejected paths
        run: python3 build/scripts/agones-rs/check_resource_derive.py

  feature-common-model-check:
    needs: migration-state
    if: needs.migration-state.outputs.model == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      AGONES_KANI_CI_RUN: feature-bool-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_INPUT_CI_RUN: feature-input-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_QUERY_ERROR_CI_RUN: feature-query-error-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_HEALTH_CI_RUN: health-defaulting-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_GS_SOURCE_CI_RUN: gameserver-source-005-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_GS_BASIC_CI_RUN: gameserver-source-014-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned verification tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
          cargo install cargo-bolero --version 0.13.4 --locked --no-default-features --features kani
      - name: Verify the exact Bolero harness through Kani
        run: python3 build/scripts/agones-rs/run.py "$AGONES_KANI_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test feature_bool_common_domain --engine kani
      - name: Require all assertions and non-vacuity covers
        run: python3 build/scripts/agones-rs/summarize_bool_proof.py "$AGONES_KANI_CI_RUN" --output "verification/agones/proof-summaries/$AGONES_KANI_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-bool-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_KANI_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_KANI_CI_RUN }}.json
          retention-days: 90
      - name: Verify production input precedence through Bolero and Kani
        run: python3 build/scripts/agones-rs/run.py "$AGONES_INPUT_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test feature_input_common_domain --engine kani
      - name: Require input assertions and all ten covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py input "$AGONES_INPUT_CI_RUN" --output "verification/agones/proof-summaries/$AGONES_INPUT_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_INPUT_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_INPUT_CI_RUN }}.json
          retention-days: 90
      - name: Verify the exact original query-error assertion through Bolero and Kani
        run: python3 build/scripts/agones-rs/run.py "$AGONES_QUERY_ERROR_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test source_query_case_003 --engine kani
      - name: Require the original query-error assertion and both covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py query "$AGONES_QUERY_ERROR_CI_RUN" --case-index 3 --output "verification/agones/proof-summaries/$AGONES_QUERY_ERROR_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-query-003-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_QUERY_ERROR_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_QUERY_ERROR_CI_RUN }}.json
          retention-days: 90
      - name: Verify production health defaults through Bolero and Kani
        run: python3 build/scripts/agones-rs/run.py "$AGONES_HEALTH_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test health_defaulting_common_domain --engine kani
      - name: Require model and production health invariants and all eight covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py health "$AGONES_HEALTH_CI_RUN" --output "verification/agones/proof-summaries/$AGONES_HEALTH_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_HEALTH_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_HEALTH_CI_RUN }}.json
          retention-days: 90
      - name: Verify the complete original default-eviction GameServer case through Bolero and Kani
        run: python3 build/scripts/agones-rs/run.py "$AGONES_GS_SOURCE_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test source_gs_case_005 --engine kani
      - name: Require all 18 original GameServer assertions and both covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py gameserver-source "$AGONES_GS_SOURCE_CI_RUN" --case-index 5 --output "verification/agones/proof-summaries/$AGONES_GS_SOURCE_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-gameserver-005-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_GS_SOURCE_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_GS_SOURCE_CI_RUN }}.json
          retention-days: 90
      - name: Reverify the complete original basic GameServer case through Bolero and Kani
        run: python3 build/scripts/agones-rs/run.py "$AGONES_GS_BASIC_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test source_gs_case_014 --engine kani
      - name: Require all 18 basic-case original assertions and both covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py gameserver-source "$AGONES_GS_BASIC_CI_RUN" --case-index 14 --output "verification/agones/proof-summaries/$AGONES_GS_BASIC_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-gameserver-014-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_GS_BASIC_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_GS_BASIC_CI_RUN }}.json
          retention-days: 90

  feature-validation-source-model-check:
    needs: migration-state
    if: needs.migration-state.outputs.model == 'true'
    name: ${{ matrix.family }}-validation-source-${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"family": "feature", "index": 0, "case": "000"}
          - {"family": "feature", "index": 1, "case": "001"}
          - {"family": "feature", "index": 2, "case": "002"}
          - {"family": "feature", "index": 3, "case": "003"}
          - {"family": "feature", "index": 4, "case": "004"}
          - {"family": "general", "index": 0, "case": "000"}
          - {"family": "general", "index": 1, "case": "001"}
          - {"family": "general", "index": 2, "case": "002"}
          - {"family": "general", "index": 3, "case": "003"}
          - {"family": "general", "index": 4, "case": "004"}
          - {"family": "general", "index": 5, "case": "005"}
          - {"family": "general", "index": 6, "case": "006"}
          - {"family": "general", "index": 7, "case": "007"}
          - {"family": "general", "index": 8, "case": "008"}
          - {"family": "general", "index": 9, "case": "009"}
          - {"family": "general", "index": 10, "case": "010"}
          - {"family": "general", "index": 11, "case": "011"}
          - {"family": "general", "index": 12, "case": "012"}
          - {"family": "general", "index": 13, "case": "013"}
          - {"family": "general", "index": 14, "case": "014"}
          - {"family": "general", "index": 15, "case": "015"}
          - {"family": "general", "index": 16, "case": "016"}
          - {"family": "general", "index": 17, "case": "017"}
          - {"family": "general", "index": 18, "case": "018"}
          - {"family": "general", "index": 19, "case": "019"}
          - {"family": "general", "index": 20, "case": "020"}
          - {"family": "general", "index": 21, "case": "021"}
          - {"family": "general", "index": 22, "case": "022"}
          - {"family": "general", "index": 23, "case": "023"}
          - {"family": "general", "index": 24, "case": "024"}
          - {"family": "metadata", "index": 0, "case": "000"}
          - {"family": "metadata", "index": 1, "case": "001"}
          - {"family": "metadata", "index": 2, "case": "002"}
          - {"family": "metadata", "index": 3, "case": "003"}
          - {"family": "metadata", "index": 4, "case": "004"}
          - {"family": "metadata", "index": 5, "case": "005"}
    env:
      CARGO_BUILD_JOBS: "2"
      AGONES_VALIDATION_CI_RUN: ${{ matrix.family == 'metadata' && 'object-metadata' || matrix.family == 'feature' && 'gameserver-validation' || 'gameserver-general-validation' }}-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}-case-${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned verification tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
          cargo install cargo-bolero --version 0.13.4 --locked --no-default-features --features kani
      - name: Verify the complete selected original validation case
        run: python3 build/scripts/agones-rs/run.py "$AGONES_VALIDATION_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test "${{ matrix.family == 'metadata' && 'source_metadata' || matrix.family == 'feature' && 'source_gsv' || 'source_gs_validate' }}_case_${{ matrix.case }}" --engine kani
      - name: Require every selected original assertion and both non-vacuity covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py "${{ matrix.family == 'metadata' && 'object-metadata-source' || matrix.family == 'feature' && 'gameserver-validation-source' || 'gameserver-general-validation-source' }}" "$AGONES_VALIDATION_CI_RUN" --case-index "${{ matrix.index }}" --output "verification/agones/proof-summaries/$AGONES_VALIDATION_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-${{ matrix.family == 'metadata' && 'metadata-validation' || matrix.family == 'feature' && 'validation' || 'general-validation' }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_VALIDATION_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_VALIDATION_CI_RUN }}.json
          retention-days: 90

  feature-validation-contract-model-check:
    needs: migration-state
    if: needs.migration-state.outputs.model == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      AGONES_VALIDATION_CONTRACT_CI_RUN: gameserver-features-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned verification tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
          cargo install cargo-bolero --version 0.13.4 --locked --no-default-features --features kani
      - name: Verify the separate PlayerTracking source-contract relation
        run: python3 build/scripts/agones-rs/run.py "$AGONES_VALIDATION_CONTRACT_CI_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test gameserver_feature_validation_common_domain --engine kani
      - name: Require all three contract claims and eight non-vacuity covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py gameserver-features "$AGONES_VALIDATION_CONTRACT_CI_RUN" --output "verification/agones/proof-summaries/$AGONES_VALIDATION_CONTRACT_CI_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-kani-player-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_VALIDATION_CONTRACT_CI_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_VALIDATION_CONTRACT_CI_RUN }}.json
          retention-days: 90

  feature-bool-model-check:
    needs: [migration-state, feature-common-model-check, feature-validation-source-model-check, feature-validation-contract-model-check]
    if: always() && needs.migration-state.outputs.model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected model job to succeed
        env:
          COMMON_RESULT: ${{ needs.feature-common-model-check.result }}
          VALIDATION_RESULT: ${{ needs.feature-validation-source-model-check.result }}
          CONTRACT_RESULT: ${{ needs.feature-validation-contract-model-check.result }}
        run: |
          test "$COMMON_RESULT" = success
          test "$VALIDATION_RESULT" = success
          test "$CONTRACT_RESULT" = success

  metadata-whole-case-diagnostic:
    # A bounded diagnostic of an isolated production change. The ordinary
    # required43selection matrix above remains the acceptance path.
    if: github.event_name == 'push' && startsWith(github.ref_name, 'codex/agones-model-diagnostic-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      AGONES_METADATA_DIAGNOSTIC_RUN: object-metadata-bolero-kani-ci-${{ github.run_id }}-${{ github.run_attempt }}-case-005
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned verification tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
          cargo install cargo-bolero --version 0.13.4 --locked --no-default-features --features kani
      - name: Verify the complete original MetaPatch action sequence
        run: python3 build/scripts/agones-rs/run.py "$AGONES_METADATA_DIAGNOSTIC_RUN" --quiet --cwd crates/agones-core python3 ../../build/scripts/agones-rs/protect_model.py cargo bolero test source_metadata_case_005 --engine kani
      - name: Require all ten original assertions and both covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py object-metadata-source "$AGONES_METADATA_DIAGNOSTIC_RUN" --case-index 5 --output "verification/agones/proof-summaries/$AGONES_METADATA_DIAGNOSTIC_RUN.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-whole-case-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/agones/runs/${{ env.AGONES_METADATA_DIAGNOSTIC_RUN }}.*
            verification/agones/proof-summaries/${{ env.AGONES_METADATA_DIAGNOSTIC_RUN }}.json
          retention-days: 90
