name: cpg-schema-base-branch-check

on:
  push:
    branches:
      - cpg-schema-base-jsonschema

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpg-schema-base-jsonschema
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Generate cpg-rs lockfile
        working-directory: cpg-rs
        run: cargo generate-lockfile
      - name: Run SchemaBase contract test
        working-directory: cpg-rs
        run: cargo test --test schema schema_base_preserves_scala_default_and_validates_dynamic_json
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- cpg-rs/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpg-rs/Cargo.lock
          git commit -m "cpg-rs: update lockfile for jsonschema"
          git push origin HEAD:cpg-schema-base-jsonschema
