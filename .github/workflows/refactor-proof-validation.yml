name: Temporary refactor proof validation

on:
  push:
    branches:
      - codex/agones-refactor-cgp-deftly-comprende-001
    paths:
      - .github/workflows/refactor-proof-validation.yml

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    env:
      AGONES_KANI_CI_RUN: refactor-feature-bool-bolero-kani-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_INPUT_CI_RUN: refactor-feature-input-bolero-kani-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_QUERY_ERROR_CI_RUN: refactor-feature-query-error-bolero-kani-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_HEALTH_CI_RUN: refactor-health-defaulting-bolero-kani-${{ github.run_id }}-${{ github.run_attempt }}
      AGONES_GS_SOURCE_CI_RUN: refactor-gameserver-source-005-bolero-kani-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned verification tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
          cargo install cargo-bolero --version 0.13.4 --locked --no-default-features --features kani
      - name: Verify exact feature bool harness
        env:
          CARGO_BUILD_JOBS: "2"
        run: python3 build/scripts/agones-rs/run.py "$AGONES_KANI_CI_RUN" --quiet --cwd crates/agones-core cargo bolero test feature_bool_common_domain --engine kani
      - name: Require feature bool assertions and covers
        run: python3 build/scripts/agones-rs/summarize_bool_proof.py "$AGONES_KANI_CI_RUN" --output "verification/agones/proof-summaries/$AGONES_KANI_CI_RUN.json"
      - name: Verify feature input precedence
        env:
          CARGO_BUILD_JOBS: "2"
        run: python3 build/scripts/agones-rs/run.py "$AGONES_INPUT_CI_RUN" --quiet --cwd crates/agones-core cargo bolero test feature_input_common_domain --engine kani
      - name: Require input assertions and covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py input "$AGONES_INPUT_CI_RUN" --output "verification/agones/proof-summaries/$AGONES_INPUT_CI_RUN.json"
      - name: Verify exact query-error source case
        env:
          CARGO_BUILD_JOBS: "2"
        run: python3 build/scripts/agones-rs/run.py "$AGONES_QUERY_ERROR_CI_RUN" --quiet --cwd crates/agones-core cargo bolero test source_query_case_003 --engine kani
      - name: Require query-error assertions and covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py query "$AGONES_QUERY_ERROR_CI_RUN" --case-index 3 --output "verification/agones/proof-summaries/$AGONES_QUERY_ERROR_CI_RUN.json"
      - name: Verify production health defaults
        env:
          CARGO_BUILD_JOBS: "2"
        run: python3 build/scripts/agones-rs/run.py "$AGONES_HEALTH_CI_RUN" --quiet --cwd crates/agones-core cargo bolero test health_defaulting_common_domain --engine kani
      - name: Require health invariants and covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py health "$AGONES_HEALTH_CI_RUN" --output "verification/agones/proof-summaries/$AGONES_HEALTH_CI_RUN.json"
      - name: Verify complete original GameServer default-eviction case
        env:
          CARGO_BUILD_JOBS: "2"
        run: python3 build/scripts/agones-rs/run.py "$AGONES_GS_SOURCE_CI_RUN" --quiet --cwd crates/agones-core timeout --signal=TERM --kill-after=15s 900s /usr/bin/time -v cargo bolero test source_gs_case_005 --engine kani
      - name: Require all original GameServer assertions and covers
        run: python3 build/scripts/agones-rs/summarize_feature_proof.py gameserver-source "$AGONES_GS_SOURCE_CI_RUN" --case-index 5 --output "verification/agones/proof-summaries/$AGONES_GS_SOURCE_CI_RUN.json"
      - name: Commit proof evidence
        run: |
          git config user.name "agones-rs-refactor-bot"
          git config user.email "agones-rs-refactor-bot@users.noreply.github.com"
          git add verification/agones/runs/refactor-* verification/agones/proof-summaries/refactor-*
          git commit -m "Record refactor proof evidence [skip ci]"
          git push
