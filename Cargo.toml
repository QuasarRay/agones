[workspace]
resolver = "2"
members = [
    "crates/agones-core",
    "crates/agones-macros",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/QuasarRay/agones"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
agones-macros = { path = "crates/agones-macros" }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full"] }
