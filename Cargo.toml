[workspace]
resolver = "2"
members = [
    "crates/agones-core",
    "crates/agones-macros",
    "crates/agones-rusternetes",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/QuasarRay/agones"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
agones-macros = { path = "crates/agones-macros" }
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
rusternetes-common = { git = "https://github.com/calfonso/rusternetes.git", rev = "125c0f4a2b6fb888102606493c5e3cf7a126dd58", package = "rusternetes-common" }
