[workspace]
resolver = "2"
exclude = ["rust-support/agones/vendor/hyper-1.12.0"]
members = [
    "rust-support/agones",
    "crates/agones-core",
    "crates/agones-macros",
    "crates/agones-rusternetes", "crates/util",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/QuasarRay/agones"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4.38"
chrono-tz = "0.10.0"
cgp = "=0.8.0-alpha"
derive-deftly = "=1.14.0"
agones-source = { path = "rust-support/agones" }
cron = "0.12.1"
genco = "0.17.10"
num-bigint = "=0.4.8"
futures = "0.3"
extism = { version = "=1.13.0", default-features = false }
agones-macros = { path = "crates/agones-macros" }
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
syn = { version = "2.0", features = ["full"] }
url = "2.5.2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16.0"
rusternetes-common = { git = "https://github.com/calfonso/rusternetes.git", rev = "125c0f4a2b6fb888102606493c5e3cf7a126dd58", package = "rusternetes-common" }
rusternetes-storage = { git = "https://github.com/calfonso/rusternetes.git", rev = "125c0f4a2b6fb888102606493c5e3cf7a126dd58", package = "rusternetes-storage" }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }

[patch.crates-io]
hyper = { path = "rust-support/agones/vendor/hyper-1.12.0" }
