[package]
name = "cpg-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0 AND (MPL-2.0 OR EPL-1.0)"
repository = "https://github.com/QuasarRay/agones"

[workspace]
# schema/ is the literal upstream source mirror. The separately retained
# CPGSchema workspace is adopted through the source map in M0006.
members = ["."]
resolver = "2"

[features]
default = ["generated-domain", "native-schema", "protobuf-bindings"]
generated-domain = []
native-schema = []
protobuf-bindings = []
source-inventory = ["dep:tree-sitter", "dep:tree-sitter-scala", "dep:tree-sitter-java"]

[dependencies]
cgp = "=0.8.0-alpha"
derive-deftly = "=1.14.0"
comprende = { path = "../third_party/first-generation/comprende" }
better_comprehension = { path = "../third_party/first-generation/better-comprehension" }
genco = { path = "../third_party/first-generation/genco" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.11.1"
rayon = "=1.12.0"
tempfile = "=3.27.0"
tracing = "=0.1.44"
protobuf = "=3.7.2"
protobuf-codegen = "=3.7.2"
protobuf-parse = "=3.7.2"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
zstd = { version = "=0.13.3", default-features = false }
flate2 = "=1.1.10"
rmpv = "=1.3.1"
grafeo = { path = "../third_party/first-generation/grafeo/grafeo", version = "=0.5.44", default-features = false, features = ["edge", "wal", "grafeo-file"] }
tree-sitter = { version = "=0.27.1", optional = true }
tree-sitter-scala = { version = "=0.26.3", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
jsonschema = "0.60.1"

[patch.crates-io]
grafeo-common = { path = "../third_party/first-generation/grafeo/grafeo-common" }
grafeo-core = { path = "../third_party/first-generation/grafeo/grafeo-core" }
grafeo-adapters = { path = "../third_party/first-generation/grafeo/grafeo-adapters" }
grafeo-storage = { path = "../third_party/first-generation/grafeo/grafeo-storage" }
grafeo-engine = { path = "../third_party/first-generation/grafeo/grafeo-engine" }

[[bin]]
name = "cpg-source-inventory"
path = "src/bin/source_inventory.rs"
required-features = ["source-inventory"]

[[bin]]
name = "cpg-domain"
path = "src/bin/domain.rs"

[[bin]]
name = "cpg-schema-constructors"
path = "src/bin/construction.rs"

[[bin]]
name = "cpg-schema"
path = "src/bin/schema.rs"
required-features = ["native-schema"]

[[bin]]
name = "cpg-protobuf-bindings"
path = "src/bin/protobuf_bindings.rs"
required-features = ["native-schema"]

[[bin]]
name = "cpg-storage"
path = "src/bin/storage.rs"
required-features = ["native-schema"]
